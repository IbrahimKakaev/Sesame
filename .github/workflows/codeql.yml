name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Chaque lundi : les règles d'analyse évoluent même quand le code ne bouge pas.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse de sécurité du code (${{ matrix.langage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        langage: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.langage }}
          # Analyse du code source Java sans compilation
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
