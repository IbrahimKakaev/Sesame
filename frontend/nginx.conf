# Sert l'application Angular et relaie /api vers le backend : le navigateur ne parle
# qu'à une seule origine, donc sans CORS, et le cookie de session reste « SameSite=Strict ».
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Seuls les scripts et les styles de l'application sont exécutés
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Les réponses arrivent en flux (SSE) : aucun tampon entre le backend et le navigateur
        proxy_buffering off;
        proxy_read_timeout 180s;
        # Même plafond que le backend, plus la marge du formulaire
        client_max_body_size 11m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
